[phases.setup]
nixPkgs = ["python311", "gcc", "g++"]
aptPkgs = ["build-essential"]

[phases.install]
cmds = ["pip install --upgrade pip setuptools wheel", "pip install -r requirements.txt"]

[start]
cmd = "python main.py"

[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"
PYTHONUNBUFFERED = "1"
